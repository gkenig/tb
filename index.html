<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black">
<meta name="apple-mobile-web-app-title" content="Tube Board">
<link rel="apple-touch-icon" href="icon.png">
<link rel="icon" href="icon.png">
<title>Tube Board</title>
<style>
  body { margin: 0; background: #1a1a1a; color: #ddd; font-family: system-ui, sans-serif; }
  header { display: flex; flex-wrap: wrap; align-items: center; gap: 12px; padding: 16px; background: #000; }
  header h1 { flex: 1; margin: 0; font-size: 20px; color: #fff; }
  select, button { font-size: 16px; padding: 6px 10px; }
  main { max-width: 760px; margin: 0 auto; padding: 16px; }
  .journey { margin-bottom: 24px; }
  .title { display: flex; align-items: center; gap: 8px; margin: 0 0 8px; padding: 10px 16px; color: #fff; font-size: 20px; border-radius: 4px; }
  .title span { flex: 1; }
  .status { margin: 0 0 8px; padding: 8px 12px; background: #ffcc00; color: #000; font-size: 14px; border-radius: 4px; }
  .platform { background: #000; border: 4px solid #333; border-radius: 6px; margin-bottom: 8px; padding: 12px 16px;
              font-family: "Courier New", monospace; color: #ffb000; }
  .platform h3 { margin: 0 0 8px; font-size: 14px; color: #888; text-transform: uppercase; }
  .row { display: flex; gap: 12px; font-size: 22px; line-height: 1.6; }
  .dest { flex: 1; overflow: hidden; white-space: nowrap; text-overflow: ellipsis; }
  .meta { color: #888; font-size: 13px; }
  .edit-only { display: none; }
  body.editing .edit-only { display: inline-block; }
  [hidden] { display: none !important; }
</style>
</head>
<body>
<section id="home">
  <header>
    <h1>My journeys</h1>
    <button id="share" class="edit-only">Share list</button>
    <button id="import" class="edit-only">Import</button>
    <button id="edit">Edit</button>
    <button id="add">+ Add</button>
  </header>
  <main>
    <div id="journeys"></div>
    <p class="meta" id="homeMeta"></p>
  </main>
</section>
<section id="picker" hidden>
  <header>
    <button id="back" aria-label="Back to my journeys">←</button>
    <select id="line" aria-label="Line"></select>
    <select id="stop" aria-label="Station"></select>
    <select id="platform" aria-label="Platform"><option value="">All platforms</option></select>
    <button id="save">Save journey</button>
  </header>
  <main>
    <div id="board"></div>
    <p class="meta" id="meta"></p>
  </main>
</section>
<script>
const API = "https://api.tfl.gov.uk";
const COLOURS = { bakerloo: "#b36305", central: "#e32017", circle: "#ffd300", district: "#00782a",
  "hammersmith-city": "#f3a9bb", jubilee: "#a0a5a9", metropolitan: "#9b0056", northern: "#000",
  piccadilly: "#003688", victoria: "#0098d4", "waterloo-city": "#95cdba", elizabeth: "#6950a1", dlr: "#00a4a7",
  liberty: "#61686b", lioness: "#f1b41c", mildmay: "#437ec1", suffragette: "#39b97a", weaver: "#972861", windrush: "#ef4d5e" };
const $ = id => document.getElementById(id);
const [lineSel, stopSel, platformSel] = [$("line"), $("stop"), $("platform")];
const params = new URLSearchParams(location.search);
const ALL_PLATFORMS = `<option value="">All platforms</option>`;
let timer, requestId = 0;

// Journeys live only in this device's browser storage: [{ line, lineName, stop, stopName, platform }]
function loadJourneys() { try { return JSON.parse(localStorage.getItem("journeys")) || []; } catch { return []; } }
function saveJourneys() { try { localStorage.setItem("journeys", JSON.stringify(journeys)); } catch {} }
let journeys = loadJourneys();

async function get(path) {
  const r = await fetch(API + path, { cache: "no-store" }); // TfL sends max-age=30; bypass it to get fresh predictions
  if (!r.ok) throw new Error(`TfL API returned ${r.status}`);
  return r.json();
}
const esc = s => String(s).replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" })[c]);
const clean = name => name.replace(/ (Underground|Rail|DLR) Station$/, "");
const mins = s => s < 60 ? "Due" : `${Math.floor(s / 60)} min`;
const dest = a => clean(a.destinationName || a.towards || "Check front of train");
function pick(sel, value) { sel.value = value; if (sel.selectedIndex < 0) sel.selectedIndex = 0; }

const pickerJourney = () => ({
  line: lineSel.value, lineName: lineSel.selectedOptions[0].text,
  stop: stopSel.value, stopName: stopSel.selectedOptions[0].text, platform: platformSel.value });

function boardHtml(j, arrivals, index, statusMessages = []) {
  const byPlatform = {};
  arrivals.filter(a => !j.platform || a.platformName === j.platform)
          .sort((a, b) => a.timeToStation - b.timeToStation)
          .forEach(a => (byPlatform[a.platformName] ??= []).push(a));
  const platforms = Object.keys(byPlatform).sort();
  const controls = index === undefined ? "" :
    `<button class="edit-only" data-up="${index}" aria-label="Move up">↑</button>` +
    `<button class="edit-only" data-del="${index}" aria-label="Remove">✕</button>`;
  return `<div class="journey">
    <h2 class="title" style="background:${COLOURS[j.line] || "#444"}"><span>${esc(j.stopName)} · ${esc(j.lineName)}</span>${controls}</h2>
    ${statusMessages.map(m => `<p class="status">${m}</p>`).join("")}
    ${platforms.length ? platforms.map(p => `
      <section class="platform"><h3>${p}</h3>
        ${byPlatform[p].slice(0, 3).map((a, i) =>
          `<div class="row"><span>${i + 1}</span><span class="dest">${dest(a)}</span><span>${mins(a.timeToStation)}</span></div>`).join("")}
      </section>`).join("")
    : `<section class="platform">${j.platform ? `${esc(j.platform)}: no` : "No"} trains currently expected</section>`}
  </div>`;
}

function fillPlatforms(arrivals) {
  const current = platformSel.value;
  const names = [...new Set(arrivals.map(a => a.platformName))].sort();
  if (current && !names.includes(current)) names.push(current);
  platformSel.innerHTML = ALL_PLATFORMS + names.map(p => `<option>${p}</option>`).join("");
  platformSel.value = current;
}

async function refresh() {
  clearTimeout(timer);
  const onHome = !$("home").hidden;
  if (!onHome && !stopSel.value) return; // stations still loading; loadStops() will call refresh
  const id = ++requestId;
  const list = onHome ? journeys : [pickerJourney()];
  const [target, meta] = onHome ? [$("journeys"), $("homeMeta")] : [$("board"), $("meta")];
  history.replaceState(null, "", onHome ? location.pathname : `?line=${lineSel.value}&stop=${stopSel.value}`);
  if (!list.length) {
    target.innerHTML = `<p>No journeys yet. Tap “+ Add” to pick a line and station, then “Save journey”.</p>`;
    meta.textContent = "";
    return;
  }
  try {
    const lineIds = [...new Set(list.map(j => j.line))].join(",");
    const [statuses, ...results] = await Promise.all([
      get(`/Line/${lineIds}/Status`).catch(() => []), // a status failure shouldn't hide the arrivals
      ...list.map(j => get(`/Line/${j.line}/Arrivals/${j.stop}`))]);
    if (id !== requestId) return; // view or selection changed while loading
    const messages = {}; // line id -> status texts, for anything other than "Good Service" (severity 10)
    for (const l of statuses)
      messages[l.id] = [...new Set(l.lineStatuses.filter(s => s.statusSeverity !== 10)
                                                 .map(s => s.reason || s.statusSeverityDescription))];
    if (!onHome) fillPlatforms(results[0]);
    target.innerHTML = list.map((j, i) => boardHtml(j, results[i], onHome ? i : undefined, messages[j.line])).join("");
    meta.textContent = `Updated ${new Date().toLocaleTimeString()} · refreshes every 10s`;
  } catch (e) {
    meta.textContent = `${e.message} · retrying in 10s`;
  }
  timer = setTimeout(refresh, 10000);
}

function showHome(home) {
  $("home").hidden = !home;
  $("picker").hidden = home;
  refresh();
}

async function loadStops(stop) {
  const stops = await get(`/Line/${lineSel.value}/StopPoints`);
  stops.sort((a, b) => a.commonName.localeCompare(b.commonName));
  stopSel.innerHTML = stops.map(s => `<option value="${s.naptanId}">${clean(s.commonName)}</option>`).join("");
  pick(stopSel, stop);
  platformSel.innerHTML = ALL_PLATFORMS;
  if (!$("picker").hidden) refresh();
}

// Backup/share: the whole list travels inside a link as ?journeys=<JSON>. Links can come from anyone,
// so only well-formed journeys are kept and names are escaped when shown (see esc).
function importJourneys(encoded) {
  let incoming;
  try { incoming = JSON.parse(encoded); } catch {}
  if (!Array.isArray(incoming)) return alert("That link doesn't contain any journeys.");
  const key = j => `${j.line}|${j.stop}|${j.platform}`;
  const have = new Set(journeys.map(key));
  const fresh = incoming
    .filter(j => j && /^[\w-]+$/.test(j.line) && /^\w+$/.test(j.stop) && typeof j.lineName === "string" && typeof j.stopName === "string")
    .map(j => ({ line: j.line, lineName: j.lineName, stop: j.stop, stopName: j.stopName, platform: String(j.platform || "") }))
    .filter(j => !have.has(key(j)));
  if (!fresh.length) return alert("You already have all the journeys in that link.");
  if (!confirm(`Add ${fresh.length} journey${fresh.length > 1 ? "s" : ""} to your list?\n\n` +
               fresh.map(j => `${j.stopName} · ${j.lineName}`).join("\n"))) return;
  journeys.push(...fresh);
  saveJourneys();
}

async function shareJourneys() {
  if (!journeys.length) return alert("No journeys to share yet.");
  const url = `${location.origin}${location.pathname}?journeys=${encodeURIComponent(JSON.stringify(journeys))}`;
  try {
    if (navigator.share) await navigator.share({ title: "My Tube Board journeys", url });
    else { await navigator.clipboard.writeText(url); alert("Link copied."); }
  } catch (e) {
    if (e.name !== "AbortError") prompt("Copy this link:", url); // AbortError = share sheet dismissed
  }
}

$("share").onclick = shareJourneys;
$("import").onclick = () => {
  const text = prompt("Paste a Tube Board journeys link:");
  if (!text) return;
  let encoded = null;
  try { encoded = new URL(text.trim()).searchParams.get("journeys"); } catch {}
  importJourneys(encoded);
  refresh();
};
lineSel.onchange = () => loadStops(null);
stopSel.onchange = () => { platformSel.innerHTML = ALL_PLATFORMS; refresh(); };
platformSel.onchange = refresh;
$("add").onclick = () => showHome(false);
$("back").onclick = () => showHome(true);
$("save").onclick = () => { journeys.push(pickerJourney()); saveJourneys(); showHome(true); };
$("edit").onclick = () => { $("edit").textContent = document.body.classList.toggle("editing") ? "Done" : "Edit"; };
$("journeys").onclick = e => {
  const { up, del } = e.target.dataset;
  if (del !== undefined) journeys.splice(del, 1);
  else if (up > 0) journeys.splice(up - 1, 0, journeys.splice(up, 1)[0]);
  else return;
  saveJourneys();
  refresh();
};
document.onvisibilitychange = () => { if (!document.hidden) refresh(); };

if (params.has("journeys")) importJourneys(params.get("journeys"));
showHome(!params.has("line")); // on the home screen this also strips ?journeys= from the address
get("/Line/Mode/tube,elizabeth-line,dlr,overground").then(lines => {
  lineSel.innerHTML = lines.map(l => `<option value="${l.id}">${l.name}</option>`).join("");
  pick(lineSel, params.get("line"));
  return loadStops(params.get("stop"));
}).catch(e => $("meta").textContent = e.message);
</script>
</body>
</html>
