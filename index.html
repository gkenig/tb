<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black">
<meta name="apple-mobile-web-app-title" content="Tube Board">
<title>Tube Board</title>
<style>
  body { margin: 0; background: #1a1a1a; color: #ddd; font-family: system-ui, sans-serif; }
  header { display: flex; flex-wrap: wrap; gap: 12px; padding: 16px; background: #000; }
  select { font-size: 16px; padding: 6px 8px; }
  main { max-width: 760px; margin: 0 auto; padding: 16px; }
  #title { margin: 0 0 16px; padding: 10px 16px; color: #fff; font-size: 22px; border-radius: 4px; }
  .platform { background: #000; border: 4px solid #333; border-radius: 6px; margin-bottom: 16px; padding: 12px 16px;
              font-family: "Courier New", monospace; color: #ffb000; }
  .platform h2 { margin: 0 0 8px; font-size: 14px; color: #888; text-transform: uppercase; }
  .row { display: flex; gap: 12px; font-size: 22px; line-height: 1.6; }
  .dest { flex: 1; overflow: hidden; white-space: nowrap; text-overflow: ellipsis; }
  #meta { color: #888; font-size: 13px; }
</style>
</head>
<body>
<header>
  <select id="line" aria-label="Line"></select>
  <select id="stop" aria-label="Station"></select>
</header>
<main>
  <h1 id="title"></h1>
  <div id="board"></div>
  <p id="meta"></p>
</main>
<script>
const API = "https://api.tfl.gov.uk";
const COLOURS = { bakerloo: "#b36305", central: "#e32017", circle: "#ffd300", district: "#00782a",
  "hammersmith-city": "#f3a9bb", jubilee: "#a0a5a9", metropolitan: "#9b0056", northern: "#000",
  piccadilly: "#003688", victoria: "#0098d4", "waterloo-city": "#95cdba", elizabeth: "#6950a1" };
const [lineSel, stopSel, title, board, meta] = ["line", "stop", "title", "board", "meta"].map(id => document.getElementById(id));
const params = new URLSearchParams(location.search);
let timer;

async function get(path) {
  const r = await fetch(API + path);
  if (!r.ok) throw new Error(`TfL API returned ${r.status}`);
  return r.json();
}
const clean = name => name.replace(/ (Underground|Rail) Station$/, "");
const mins = s => s < 60 ? "Due" : `${Math.floor(s / 60)} min`;
const dest = a => clean(a.destinationName || a.towards || "Check front of train");
function pick(sel, value) { sel.value = value; if (sel.selectedIndex < 0) sel.selectedIndex = 0; }

async function loadStops(stop) {
  const stops = await get(`/Line/${lineSel.value}/StopPoints`);
  stops.sort((a, b) => a.commonName.localeCompare(b.commonName));
  stopSel.innerHTML = stops.map(s => `<option value="${s.naptanId}">${clean(s.commonName)}</option>`).join("");
  pick(stopSel, stop);
  show();
}

async function show() {
  clearTimeout(timer);
  const line = lineSel.value, stop = stopSel.value;
  history.replaceState(null, "", `?line=${line}&stop=${stop}`);
  title.textContent = `${stopSel.selectedOptions[0].text} · ${lineSel.selectedOptions[0].text}`;
  title.style.background = COLOURS[line] || "#444";
  try {
    const arrivals = await get(`/Line/${line}/Arrivals/${stop}`);
    if (line !== lineSel.value || stop !== stopSel.value) return; // selection changed while loading
    render(arrivals);
    meta.textContent = `Updated ${new Date().toLocaleTimeString()} · refreshes every 30s`;
  } catch (e) {
    meta.textContent = `${e.message} · retrying in 30s`;
  }
  timer = setTimeout(show, 30000);
}

function render(arrivals) {
  const byPlatform = {};
  arrivals.sort((a, b) => a.timeToStation - b.timeToStation)
          .forEach(a => (byPlatform[a.platformName] ??= []).push(a));
  const platforms = Object.keys(byPlatform).sort();
  board.innerHTML = platforms.length ? platforms.map(p => `
    <section class="platform"><h2>${p}</h2>
      ${byPlatform[p].slice(0, 3).map((a, i) =>
        `<div class="row"><span>${i + 1}</span><span class="dest">${dest(a)}</span><span>${mins(a.timeToStation)}</span></div>`).join("")}
    </section>`).join("")
    : `<section class="platform">No trains currently expected</section>`;
}

lineSel.onchange = () => loadStops(null);
stopSel.onchange = show;
document.onvisibilitychange = () => { if (!document.hidden && stopSel.value) show(); };

get("/Line/Mode/tube,elizabeth-line").then(lines => {
  lineSel.innerHTML = lines.map(l => `<option value="${l.id}">${l.name}</option>`).join("");
  pick(lineSel, params.get("line"));
  return loadStops(params.get("stop"));
}).catch(e => meta.textContent = e.message);
</script>
</body>
</html>
